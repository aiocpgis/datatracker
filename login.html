<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V10 - لوحة الحصر الميداني المتقدمة</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: {
            brand: {
              bg: '#041026',
              card: '#122345',
              input: '#1a2e58',
              btn: '#3277f6',
              btnHover: '#1c5ce5',
              textMuted: '#8b9fc0',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="assets/css/login.css" />
</head>

<body class="bg-brand-bg text-white min-h-screen relative flex flex-col items-center justify-center overflow-hidden">

  <!-- Glowing background effect -->
  <div class="absolute inset-0 z-0 pointer-events-none">
    <!-- Starry particles overlay -->
    <div id="particles-container" class="absolute inset-0"></div>
    <!-- Soft central glow -->
    <div
      class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-blue-500/10 rounded-full blur-[120px]">
    </div>
  </div>

  <!-- Login Card container -->
  <main class="w-full max-w-[420px] mx-auto relative z-10 animate__animated animate__fadeIn">
    <div
      class="login-card bg-brand-card/80 backdrop-blur-md rounded-[32px] p-10 pt-8 border border-white/5 shadow-2xl flex flex-col items-center">

      <!-- Language Toggle -->
      <div class="flex gap-2 mb-8">
        <button
          class="w-10 h-10 rounded-full bg-brand-input border border-white/5 text-xs font-bold text-gray-400 hover:text-white transition-colors">EN</button>
        <button
          class="w-10 h-10 rounded-full bg-brand-btn shadow-[0_0_15px_rgba(50,119,246,0.6)] text-xs font-bold text-white transition-colors">AR</button>
      </div>

      <!-- Logos -->
      <div
        class="flex items-center gap-5 mb-8 w-full justify-center bg-white/5 rounded-2xl py-3 px-4 border border-white/10 shadow-inner backdrop-blur-sm">
        <img src="logo1.png" alt="Logo 1"
          class="h-12 object-contain drop-shadow-md hover:scale-110 transition-transform duration-300">
        <img src="logo2.png" alt="Logo 2"
          class="h-12 object-contain drop-shadow-md hover:scale-110 transition-transform duration-300">
        <img src="logo3.png" alt="Logo 3"
          class="h-12 object-contain drop-shadow-md hover:scale-110 transition-transform duration-300">
      </div>

      <!-- Headings -->
      <div class="text-center w-full mb-10">
        <h1 class="text-2xl font-bold mb-2 tracking-wide text-white">لوحة الحصر الميداني المتقدمة</h1>
        <p class="text-brand-textMuted text-[13px] font-semibold">نظام المعلومات الجغرافية المتكامل - غزة</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="w-full space-y-6">

        <!-- Username Field -->
        <div class="w-full text-right">
          <label for="username" class="block text-[13px] font-semibold text-brand-textMuted mb-2 pr-2">البريد الإلكتروني
            أو اسم المستخدم</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-brand-textMuted">
              <i class="fa-solid fa-user text-sm"></i>
            </div>
            <input type="text" id="username" required
              class="w-full bg-brand-input/80 border border-white/5 text-white text-sm rounded-xl py-4 pr-11 pl-4 focus:outline-none focus:ring-1 focus:ring-brand-btn transition-all placeholder-brand-textMuted/50 text-right"
              placeholder="مثال: userexample.com أو ibrahim" dir="rtl">
          </div>
        </div>

        <!-- Password Field -->
        <div class="w-full text-right">
          <label for="password" class="block text-[13px] font-semibold text-brand-textMuted mb-2 pr-2">كلمة
            المرور</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-brand-textMuted">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input type="password" id="password" required
              class="w-full bg-brand-input/80 border border-white/5 text-white text-sm rounded-xl py-4 pr-11 pl-4 focus:outline-none focus:ring-1 focus:ring-brand-btn transition-all placeholder-brand-textMuted/50 text-right text-left-override"
              placeholder="........" dir="rtl">
          </div>
        </div>

        <!-- Error Msg -->
        <div id="errorMsg"
          class="hidden animate__animated animate__headShake text-red-400 text-xs font-bold bg-red-400/10 px-4 py-2 rounded-lg border border-red-400/20 flex items-center justify-center gap-2">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>بيانات الدخول غير صحيحة.</span>
        </div>

        <!-- Login Button -->
        <button type="submit" id="submitBtn"
          class="w-full bg-brand-btn hover:bg-brand-btnHover text-white font-bold text-[15px] py-4 rounded-xl shadow-[0_8px_20px_rgba(50,119,246,0.3)] hover:shadow-[0_12px_25px_rgba(50,119,246,0.4)] transition-all flex items-center justify-center gap-2 mt-4 transform hover:-translate-y-0.5">
          <span id="btnText">تسجيل الدخول</span>
          <div class="spinner-loader hidden" id="btnLoader"></div>
        </button>
      </form>
    </div>
  </main>

  <footer class="absolute bottom-6 w-full text-center z-10">
    <p class="text-brand-textMuted/60 text-[11px] font-semibold">© جميع الحقوق محفوظة لدى الهيئة العربية الدولية للإعمار
      في فلسطين</p>
  </footer>

  <script type="module" src="assets/js/login.js"></script>

  <!-- Particles Script for the starry background -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById('particles-container');
      const particleCount = 40;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'star-particle absolute bg-white rounded-full';

        // Random size 1px to 2px
        const size = Math.random() * 2 + 1;
        p.style.width = size + 'px';
        p.style.height = size + 'px';

        // Random position
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = Math.random() * 100 + 'vh';

        // Random opacity and animation delay
        p.style.opacity = Math.random() * 0.5 + 0.1;

        // Setup individual floating animation
        const duration = Math.random() * 15 + 10;
        p.animate([
          { transform: `translate(0px, 0px)`, opacity: 0.1 },
          { opacity: Math.random() * 0.8 + 0.2, offset: 0.5 },
          { transform: `translate(${Math.random() * 100 - 50}px, -${Math.random() * 100 + 50}px)`, opacity: 0.1 }
        ], {
          duration: duration * 1000,
          iterations: Infinity,
          easing: 'ease-in-out',
          delay: Math.random() * 5000
        });

        container.appendChild(p);
      }
    });
  </script>
</body>

</html>
